<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOGESTRA Routen-Lernhilfe</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --blue: #00539f;
    --blue-dark: #003a70;
    --yellow: #ffd400;
    --red: #d10000;
    --bg: #f2f4f7;
    --card: #ffffff;
    --line: #d5dbe3;
    --text: #1b2430;
    --muted: #5d6b7c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg);
    display: grid; grid-template-columns: minmax(340px, 440px) 1fr; grid-template-rows: 100%;
  }

  /* ---------- Seitenleiste ---------- */
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--card); border-right: 1px solid var(--line); }
  header { background: var(--blue); color: #fff; padding: 14px 16px 12px; }
  header h1 { margin: 0; font-size: 1.05rem; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
  .badge { background: var(--yellow); color: #111; font-weight: 800; font-size: 1.3rem; padding: 2px 12px; border-radius: 8px; }
  header .sub { margin-top: 6px; font-size: .85rem; opacity: .85; }

  .controls { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }

  /* Toggle Langläufer / Kurzläufer */
  .toggle { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: #e3e8ee; border-radius: 12px; padding: 4px; }
  .toggle::before {
    content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
    background: var(--blue); border-radius: 9px; transition: transform .3s ease;
  }
  .toggle[data-variant="kurz"]::before, .toggle[data-dir="rueck"]::before { transform: translateX(100%); }
  .toggle button {
    position: relative; z-index: 1; border: 0; background: none; padding: 10px 6px; font: inherit; font-weight: 700;
    color: var(--muted); cursor: pointer; transition: color .3s; border-radius: 9px; line-height: 1.2;
  }
  .toggle button small { display: block; font-weight: 400; font-size: .72rem; }
  .toggle button[aria-pressed="true"] { color: #fff; }

  .btn-export {
    border: 0; border-radius: 12px; padding: 13px 14px; font: inherit; font-weight: 800; font-size: 1rem;
    background: var(--yellow); color: #111; cursor: pointer; box-shadow: 0 2px 0 #b89b00;
  }
  .btn-export:hover { filter: brightness(1.05); }
  .btn-export:active { transform: translateY(1px); box-shadow: none; }

  .lm { width: 26px; height: 26px; border-radius: 50%; background: #FFD400; border: 2.5px solid #222; display: grid; place-items: center; font: 800 12px system-ui, sans-serif; color: #111; }
  .lm.sel { width: 32px; height: 32px; border-width: 4px; margin: -3px 0 0 -3px; }
  .lm-dwell { color: #d10000; font: 800 13px system-ui, sans-serif; white-space: nowrap; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 3px #fff; }

  /* Haltestellenliste */
  .summary { padding: 8px 16px; font-size: .85rem; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  ol#stops { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; }
  .stop { border-bottom: 1px solid var(--line); padding: 10px 16px; cursor: pointer; animation: fadeIn .35s ease; }
  .stop.selected { background: #fff9d6; box-shadow: inset 4px 0 0 var(--yellow); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .stop-head { display: flex; align-items: center; gap: 10px; }
  .num {
    flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--yellow); border: 2px solid #333;
    display: grid; place-items: center; font-weight: 800; font-size: .8rem;
  }
  .stop-name { font-weight: 700; flex: 1; }
  .dwell { color: var(--red); font-weight: 800; font-size: .9rem; white-space: nowrap; }
  .fields { display: none; margin-top: 8px; gap: 8px; }
  .stop.selected .fields { display: grid; }
  .fields label { font-size: .75rem; color: var(--muted); display: grid; gap: 3px; }
  .fields textarea, .fields input[type="text"] {
    width: 100%; font: inherit; font-size: .9rem; font-weight: 400; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical;
  }
  .fields input[type="text"] { width: 100%; }
  .fields .hint { font-size: .78rem; color: var(--muted); }
  .fields .hint button { margin-left: 6px; padding: 3px 8px; border: 1px solid var(--line); background: #fff; border-radius: 6px; font: inherit; font-size: .78rem; cursor: pointer; }
  .seg-label { color: var(--blue-dark) !important; font-weight: 700; }
  /* Kompakte Vorschau der Notizen bei nicht gewählten Haltestellen */
  .peek { margin: 4px 0 0 38px; font-size: .8rem; color: var(--muted); }
  .stop.selected .peek { display: none; }
  .peek b { color: var(--blue-dark); }

  /* ---------- Karte ---------- */
  main { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; z-index: 0; }
  #svgmap { position: absolute; inset: 0; width: 100%; height: 100%; background: #eaf0e4; }
  .svg-note { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.92); padding: 6px 10px; border-radius: 6px; font-size: .75rem; color: var(--muted); max-width: 80%; }
  .svg-info { position: absolute; left: 10px; top: 10px; background: #fff; padding: 8px 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 260px; font-size: .85rem; }
  .svg-info .st { color: var(--red); font-weight: 800; }
  .btn-live { border: 2px solid var(--blue); background: #fff; color: var(--blue); border-radius: 12px; padding: 11px 14px; font: inherit; font-weight: 800; cursor: pointer; }
  .btn-live.on { background: var(--blue); color: #fff; }
  #live { padding: 10px 16px; border-bottom: 1px solid var(--line); background: #eef5ff; display: grid; gap: 4px; }
  #live .l-top { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
  #live #liveState { text-transform: uppercase; letter-spacing: .04em; }
  #live .l-dist { font-weight: 800; color: var(--blue-dark); }
  #live .l-name { font-size: 1.25rem; font-weight: 800; }
  #live .l-stand { color: var(--red); font-weight: 800; font-size: 1.1rem; }
  #live .l-note { font-size: 1rem; }
  #live .l-prev { font-size: .95rem; background: #fff4c2; border-radius: 6px; padding: 6px 8px; }
  #live .l-warn { color: #b35c00; font-weight: 700; font-size: .9rem; }
  #live .l-row { display: flex; gap: 8px; margin-top: 4px; }
  #live .l-row button { flex: 1; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px; font: inherit; font-size: .85rem; cursor: pointer; }
  .stop.next { box-shadow: inset 4px 0 0 var(--blue); }
  .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 2px #1a73e8, 0 0 8px rgba(0,0,0,.4); }
  .hidden { display: none !important; }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
    main { order: -1; }
    aside { border-right: 0; }
  }
</style>
</head>
<body>

<aside>
  <header>
    <h1><span class="badge">390</span> BOGESTRA Routen-Lernhilfe</h1>
    <div class="sub" id="lineTitle"></div>
  </header>

  <div class="controls">
    <div class="toggle" id="dirToggle" data-dir="hin" role="group" aria-label="Fahrtrichtung">
      <button type="button" data-dir="hin" aria-pressed="true">Hinfahrt<small>Linden → Herne Bf</small></button>
      <button type="button" data-dir="rueck" aria-pressed="false">Rückfahrt<small>Herne Bf → Linden</small></button>
    </div>
    <div class="toggle" id="toggle" data-variant="lang" role="group" aria-label="Streckenvariante">
      <button type="button" data-variant="lang" aria-pressed="true">Langläufer<small>gesamte Strecke</small></button>
      <button type="button" data-variant="kurz" aria-pressed="false">Kurzläufer<small>verkürzte Strecke</small></button>
    </div>
    <button type="button" class="btn-export" id="exportBtn">⬇ Linie als .txt exportieren</button>
    <button type="button" class="btn-live" id="liveBtn">📍 Live-Verfolgung starten</button>
  </div>

  <div id="live" class="hidden" aria-live="polite">
    <div class="l-top"><span id="liveState">Nächste Haltestelle</span><span class="l-dist" id="liveDist"></span></div>
    <div class="l-name" id="liveName"></div>
    <div class="l-stand" id="liveStand"></div>
    <div class="l-note" id="liveNote"></div>
    <div class="l-prev hidden" id="livePrev"></div>
    <div class="l-warn" id="liveWarn"></div>
    <div class="l-row"><button type="button" id="followBtn">Karte folgt: an</button><button type="button" id="liveStop">Beenden</button></div>
  </div>

  <div class="summary" style="border-bottom:0;padding-bottom:0"><span id="routeStatus"></span></div>
  <div class="summary"><span id="countInfo"></span><span id="dwellInfo"></span></div>
  <ol id="stops"></ol>
</aside>

<main>
  <div id="map" class="hidden"></div>
  <svg id="svgmap" class="hidden" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="svg-info hidden" id="svgInfo"></div>
  <div class="svg-note hidden" id="svgNote">Schematische Ersatzkarte (Kartenkacheln nicht erreichbar – offline?).</div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ACTIVE_LINE = "390";   // Startkonfiguration
const parseStops = (jsonId, prefix) => JSON.parse(document.getElementById(jsonId).textContent).map((s, i) => ({
  id: prefix + String(s.stopNr != null ? s.stopNr : "idx" + i) + "-" + i,
  name: s.name, lat: s.lat, lng: s.lng, oLat: s.lat, oLng: s.lng, dLat: s.lat, dLng: s.lng, fixed: false,   // o* = Originalkoordinate (lat/lng werden auf die Straße „gesnappt“)
  standzeit: s.standzeit || "",
  fahrerNotiz: s.fahrerNotiz || "",
  isKurzlaeufer: s.isKurzlaeufer === true
}));
const line = {
  title: "Linie " + ACTIVE_LINE,
  variants: {
    lang: { label: "Langläufer", desc: "gesamte Strecke" },
    kurz: { label: "Kurzläufer", desc: "verkürzte Strecke" }
  },
  dirs: {
    hin:   { label: "Hinfahrt",   desc: "Linden → Herne Bf", stops: parseStops("haltestellen-" + ACTIVE_LINE, "") },
    rueck: { label: "Rückfahrt",  desc: "Herne Bf → Linden", stops: parseStops("haltestellen-" + ACTIVE_LINE + "-rueck", "r") }
  }
};

const STORE_KEY = "bogestra-lernhilfe-v2";

let variant = "lang";
let dir = "hin";
try { if (localStorage.getItem("bogestra-dir") === "rueck") dir = "rueck"; } catch (e) {}
let selectedId = null;
let mapView = null;
let user = loadUser();   // { standzeit: {id: text}, fahrerNotiz: {id: text}, pos: {id: {lat,lng}} }

/* ---------- Persistenz ---------- */
function loadUser() {
  try { return Object.assign({ standzeit: {}, fahrerNotiz: {}, pos: {} }, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); }
  catch (e) { return { standzeit: {}, fahrerNotiz: {}, pos: {} }; }
}
// Von Hand korrigierte Markerpositionen anwenden (aus dem Browser-Speicher)
const allStops = () => [...line.dirs.hin.stops, ...line.dirs.rueck.stops];
allStops().forEach(st => { const q = user.pos && user.pos[st.id]; if (q) { st.lat = st.oLat = q.lat; st.lng = st.oLng = q.lng; st.fixed = true; } });
function moveStop(st, lat, lng) {
  st.lat = st.oLat = lat; st.lng = st.oLng = lng; st.fixed = true;
  user.pos[st.id] = { lat, lng }; saveUser(); refresh(false);
}
function resetStop(id) {
  const st = allStops().find(x => x.id === id); if (!st) return;
  st.lat = st.oLat = st.dLat; st.lng = st.oLng = st.dLng; st.fixed = false;
  delete user.pos[id]; saveUser(); refresh(false);
}
function saveUser() { try { localStorage.setItem(STORE_KEY, JSON.stringify(user)); } catch (e) {} }

/* ---------- Abgeleitete Daten ---------- */
const getStand = s => (s.id in user.standzeit ? user.standzeit[s.id] : s.standzeit) || "";
const hasStand = s => getStand(s).trim() !== "";
const getDwell = s => parseInt(getStand(s), 10) || 0;   // Minuten, für die Summe
const getStopNote = s => (s.id in user.fahrerNotiz ? user.fahrerNotiz[s.id] : s.fahrerNotiz) || "";
const visibleStops = () => line.dirs[dir].stops.filter(s => variant === "lang" || s.isKurzlaeufer);
const dwellText = s => `${getStand(s).trim()} Standzeit`;
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- Liste ---------- */
function renderList() {
  const stops = visibleStops();
  const ol = document.getElementById("stops");
  ol.innerHTML = "";
  stops.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "stop" + (s.id === selectedId ? " selected" : "");
    li.dataset.id = s.id;
    li.innerHTML = `
      <div class="stop-head">
        <span class="num">${i + 1}</span>
        <span class="stop-name">${esc(s.name)}</span>
        ${hasStand(s) ? `<span class="dwell">${esc(dwellText(s))}</span>` : ""}
      </div>
      ${getStopNote(s) ? `<div class="peek">📝 ${esc(getStopNote(s))}</div>` : ""}
      <div class="fields">
        <label>Standzeit (z. B. „5 Min“)
          <input type="text" value="${esc(getStand(s))}" data-f="standzeit" placeholder="leer = keine Standzeit">
        </label>
        <label>Fahrer-Notiz
          <textarea rows="2" data-f="fahrerNotiz" placeholder="z. B. am Lidl rechts abbiegen">${esc(getStopNote(s))}</textarea>
        </label>
        <div class="hint">📍 Marker falsch? Den Marker dieser Haltestelle auf der Karte an die richtige Stelle ziehen.
          ${s.fixed ? '<button type="button" data-reset="1">Position zurücksetzen</button>' : ""}</div>
      </div>`;
    li.addEventListener("click", () => select(s.id, { fromList: true }));
    ol.appendChild(li);
  });

  ol.querySelectorAll("[data-reset]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); resetStop(b.closest(".stop").dataset.id); }));
  // Eingaben speichern
  ol.querySelectorAll("[data-f]").forEach(el => {
    const id = el.closest(".stop").dataset.id, f = el.dataset.f;
    el.addEventListener("click", e => e.stopPropagation());
    el.addEventListener("input", () => { user[f][id] = el.value; saveUser(); updateSummary(); });
    el.addEventListener("change", () => {
      if (f === "standzeit" && /^\d+$/.test(el.value.trim())) { user[f][id] = el.value.trim() + " Min"; saveUser(); }
      refresh(false);
    });
  });
  updateSummary();
  applyNext();
}

function updateSummary() {
  const stops = visibleStops();
  const total = stops.reduce((a, s) => a + getDwell(s), 0);
  document.getElementById("countInfo").textContent = `${stops.length} Haltestellen`;
  document.getElementById("dwellInfo").textContent = `Standzeit gesamt: ${total} Min.`;
}

/* ---------- Auswahl / Refresh ---------- */
function select(id, opts = {}) {
  selectedId = id;
  document.querySelectorAll("#stops .stop").forEach(li => li.classList.toggle("selected", li.dataset.id === id));
  const li = document.querySelector(`#stops .stop[data-id="${id}"]`);
  if (li && !opts.fromList) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
  if (mapView) mapView.select(id, opts);
}
function refresh(fit = true) {
  const stops = visibleStops();
  if (selectedId && !stops.some(s => s.id === selectedId)) selectedId = null;
  const active = document.activeElement;
  const keepFocus = active && active.dataset && active.dataset.f ? { id: active.closest(".stop").dataset.id, f: active.dataset.f } : null;
  renderList();
  if (keepFocus) {
    const el = document.querySelector(`.stop[data-id="${keepFocus.id}"] [data-f="${keepFocus.f}"]`);
    if (el) el.focus();
  }
  if (mapView) mapView.render(stops, selectedId, fit);
  if (live.on && live.pos) updateLive();
  ensureRoute(stops);
}

/* ---------- Toggle ---------- */
document.querySelectorAll("#toggle button").forEach(btn => btn.addEventListener("click", () => {
  variant = btn.dataset.variant;
  document.getElementById("toggle").dataset.variant = variant;
  document.querySelectorAll("#toggle button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  updateTitle();
  refresh(true);
}));
document.querySelectorAll("#dirToggle button").forEach(btn => btn.addEventListener("click", () => setDir(btn.dataset.dir)));
function setDir(d) {
  dir = d;
  try { localStorage.setItem("bogestra-dir", dir); } catch (e) {}
  document.getElementById("dirToggle").dataset.dir = dir;
  document.querySelectorAll("#dirToggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.dir === dir)));
  selectedId = null; live.lastSeg = 0;
  updateTitle();
  refresh(true);
}
function updateTitle() {
  document.getElementById("lineTitle").textContent = `${line.title} · ${line.dirs[dir].label} (${line.dirs[dir].desc}) · ${line.variants[variant].label}`;
}

/* ---------- Export (.txt) ---------- */
document.getElementById("exportBtn").addEventListener("click", () => {
  const stops = visibleStops();
  const total = stops.reduce((a, s) => a + getDwell(s), 0);
  const L = [];
  L.push(`BOGESTRA – ${line.title} – ${line.dirs[dir].label} (${line.dirs[dir].desc}) – ${line.variants[variant].label} (${line.variants[variant].desc})`);
  L.push(`Erstellt am: ${new Date().toLocaleString("de-DE")}`);
  L.push(`Haltestellen: ${stops.length}   |   Standzeit gesamt: ${total} Min.`);
  L.push("=".repeat(60), "");
  stops.forEach((s, i) => {
    const isLast = i === stops.length - 1;
    L.push(`${String(i + 1).padStart(2, "0")}. ${s.name}`);
    if (hasStand(s)) L.push(`    >>> STANDZEIT: ${getDwell(s)} Min. <<<`);
    if (getStopNote(s).trim()) L.push(`    Fahrer-Notiz: ${getStopNote(s).trim().replace(/\n/g, "\n                  ")}`);
    if (!isLast) {
      L.push("    |", "    v");
    } else {
      L.push("    ENDHALTESTELLE");
    }
  });
  const blob = new Blob(["﻿" + L.join("\r\n") + "\r\n"], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `BOGESTRA_Linie_${ACTIVE_LINE}_${line.dirs[dir].label}_${line.variants[variant].label}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

/* =====================================================================
   Karte 1: OpenStreetMap (Leaflet) – kein API-Key nötig
   ===================================================================== */
function LeafletView() {
  const map = L.map("map", { zoomControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>-Mitwirkende"
  }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  let byId = {}, order = [], me = null;

  const icon = (n, sel) => L.divIcon({
    className: "", html: `<div class="lm${sel ? " sel" : ""}">${n}</div>`,
    iconSize: sel ? [32, 32] : [26, 26], iconAnchor: sel ? [16, 16] : [13, 13]
  });
  const popup = (s, i) => `<div style="font-family:system-ui;max-width:220px"><b>${i + 1}. ${esc(s.name)}</b>` +
    (hasStand(s) ? `<div style="color:#d10000;font-weight:800">${esc(dwellText(s))}</div>` : "") +
    (getStopNote(s) ? `<div>📝 ${esc(getStopNote(s))}</div>` : "") + `</div>`;

  return {
    render(stops, sel, fit) {
      layer.clearLayers(); byId = {}; order = stops;
      const pts = stops.map(s => [s.lat, s.lng]);
      L.polyline(routePts(stops), { color: "#00539f", weight: 5, opacity: .9 }).addTo(layer);
      stops.forEach((s, i) => {
        const m = L.marker([s.lat, s.lng], { icon: icon(i + 1, s.id === sel), zIndexOffset: s.id === sel ? 1000 : 0, title: s.name, draggable: s.id === sel })
          .bindPopup(popup(s, i)).addTo(layer);
        m.on("click", () => select(s.id));
        m.on("dragend", () => { const ll = m.getLatLng(); moveStop(s, ll.lat, ll.lng); });
        byId[s.id] = m;
        if (hasStand(s)) {
          L.marker([s.lat, s.lng], {
            interactive: false, zIndexOffset: 500,
            icon: L.divIcon({ className: "", html: `<div class="lm-dwell">${esc(dwellText(s))}</div>`, iconSize: [0, 0], iconAnchor: [-18, -2] })
          }).addTo(layer);
        }
      });
      if (fit && pts.length) map.fitBounds(pts, { padding: [40, 40] });
      if (sel && byId[sel]) byId[sel].openPopup();
    },
    select(id, opts) {
      const m = byId[id]; if (!m) return;
      order.forEach((s, i) => { const mk = byId[s.id]; if (!mk) return; mk.setIcon(icon(i + 1, s.id === id)).setZIndexOffset(s.id === id ? 1000 : 0); s.id === id ? mk.dragging.enable() : mk.dragging.disable(); });
      m.openPopup();
      map.panTo(m.getLatLng());
    },
    resize() { map.invalidateSize(); },
    setPosition(lat, lng, acc, follow) {
      if (!me) {
        me = { dot: L.marker([lat, lng], { icon: L.divIcon({ className: "", html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false, zIndexOffset: 2000 }).addTo(map),
               acc: L.circle([lat, lng], { radius: acc, color: "#1a73e8", weight: 1, fillOpacity: .1, interactive: false }).addTo(map) };
      } else { me.dot.setLatLng([lat, lng]); me.acc.setLatLng([lat, lng]).setRadius(acc); }
      if (follow) map.setView([lat, lng], Math.max(map.getZoom(), 16), { animate: true });
    },
    clearPosition() { if (me) { me.dot.remove(); me.acc.remove(); me = null; } },
    onUserDrag(cb) { map.on("dragstart", cb); }
  };
}

/* =====================================================================
   Karte 2: schematische SVG-Ersatzkarte (Fallback ohne Internet)
   ===================================================================== */
function SvgMapView() {
  const svg = document.getElementById("svgmap");
  const NS = "http://www.w3.org/2000/svg";
  let current = [], sel = null;
  const el = (name, attrs, text) => {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  };
  function info() {
    const box = document.getElementById("svgInfo");
    const i = current.findIndex(x => x.id === sel);
    box.classList.toggle("hidden", i < 0);
    if (i < 0) return;
    const x = current[i];
    box.innerHTML = `<b>${i + 1}. ${esc(x.name)}</b>` + (hasStand(x) ? `<div class="st">${esc(dwellText(x))}</div>` : "") +
      (getStopNote(x) ? `<div>📝 ${esc(getStopNote(x))}</div>` : "");
  }
  function draw() {
    svg.innerHTML = "";
    const W = svg.clientWidth || 800, H = svg.clientHeight || 600, pad = 60, padR = 190;
    // Projektion mit ungefähr korrektem Seitenverhältnis (cos der Breite)
    const k = Math.cos(51.5 * Math.PI / 180);
    const pts = current.map(s => ({ s, x: s.lng * k, y: -s.lat }));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const scale = Math.min((W - pad - padR) / ((maxX - minX) || 1), (H - 2 * pad) / ((maxY - minY) || 1));
    const ox = pad + (W - pad - padR - (maxX - minX) * scale) / 2, oy = (H - (maxY - minY) * scale) / 2;
    pts.forEach(p => { p.px = ox + (p.x - minX) * scale; p.py = oy + (p.y - minY) * scale; });

    // Raster
    for (let x = 0; x < W; x += 60) svg.appendChild(el("line", { x1: x, y1: 0, x2: x, y2: H, stroke: "#d6dfcd", "stroke-width": 1 }));
    for (let y = 0; y < H; y += 60) svg.appendChild(el("line", { x1: 0, y1: y, x2: W, y2: y, stroke: "#d6dfcd", "stroke-width": 1 }));

    svg.appendChild(el("polyline", {
      points: pts.map(p => `${p.px},${p.py}`).join(" "), fill: "none", stroke: "#00539f",
      "stroke-width": 6, "stroke-linejoin": "round", "stroke-linecap": "round"
    }));
    pts.forEach((p, i) => {
      const g = el("g", { style: "cursor:pointer" });
      const r = p.s.id === sel ? 17 : 13;
      g.appendChild(el("circle", { cx: p.px, cy: p.py, r, fill: "#FFD400", stroke: "#222", "stroke-width": p.s.id === sel ? 4 : 2.5 }));
      g.appendChild(el("text", { x: p.px, y: p.py + 4.5, "text-anchor": "middle", "font-size": 12, "font-weight": 800, fill: "#111" }, i + 1));
      g.appendChild(el("title", {}, p.s.name));
      const label = el("text", { x: p.px + 20, y: p.py - 6, "font-size": 12, "font-weight": 600, fill: "#1b2430", stroke: "#fff", "stroke-width": 3, "paint-order": "stroke" }, p.s.name);
      g.appendChild(label);
      if (hasStand(p.s)) {
        g.appendChild(el("text", { x: p.px + 20, y: p.py + 11, "font-size": 12, "font-weight": 800, fill: "#d10000", stroke: "#fff", "stroke-width": 3, "paint-order": "stroke" }, dwellText(p.s)));
      }
      g.addEventListener("click", () => select(p.s.id));
      svg.appendChild(g);
    });
  }
  window.addEventListener("resize", () => { if (current.length) draw(); });
  return {
    setPosition() {}, clearPosition() {}, onUserDrag() {},
    render(stops, s) { current = stops; sel = s; draw(); info(); },
    select(id) { sel = id; draw(); info(); }
  };
}

/* =====================================================================
   Straßenverlauf (Routing über OSRM / OpenStreetMap-Daten)
   Die Route folgt den Straßen; die Haltestellen werden auf die Straße gesnappt.
   Ergebnis wird im Browser zwischengespeichert. Ohne Internet: Luftlinie.
   ===================================================================== */
const ROUTE_URL = "https://router.project-osrm.org/route/v1/driving/";
const routeCache = {}, routeBusy = {};
const routeKey = stops => {
  const str = stops.map(s => s.id + "@" + s.oLat + "," + s.oLng).join("|");
  let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return "bogestra-route-v2:" + stops.length + ":" + h;
};
const routePts = stops => routeCache[routeKey(stops)] || stops.map(s => [s.lat, s.lng]);
const setRouteStatus = t => { const e = document.getElementById("routeStatus"); if (e) e.textContent = t; };

async function ensureRoute(stops) {
  const key = routeKey(stops);
  if (routeCache[key]) return;
  let data = null;
  try { data = JSON.parse(localStorage.getItem(key)); } catch (e) {}
  if (!data) {
    if (routeBusy[key]) return;
    routeBusy[key] = true;
    setRouteStatus("Straßenverlauf wird geladen …");
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 25000);
    try {
      const coords = stops.map(s => s.oLng + "," + s.oLat).join(";");
      // Erst mit "Bushaltestellen-Logik" (Ankunft auf der Fahrbahnseite in Fahrtrichtung), sonst ohne
      let j = null;
      for (const extra of ["&approaches=" + stops.map(() => "curb").join(";"), ""]) {
        const r = await fetch(ROUTE_URL + coords + "?overview=full&geometries=geojson&continue_straight=true" + extra, { signal: ctl.signal });
        j = await r.json();
        if (r.ok && j.code === "Ok") break;
      }
      if (!j || j.code !== "Ok") throw new Error(j && j.code);
      data = { geo: j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]),
               wps: j.waypoints.map(w => [w.location[1], w.location[0]]),
               legs: j.routes[0].legs.map(l => l.distance) };
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
    } catch (e) {
      setRouteStatus("Straßenverlauf nicht verfügbar – Luftlinie");
      delete routeBusy[key]; return;
    } finally { clearTimeout(timer); }
    delete routeBusy[key];
  }
  routeCache[key] = data.geo;
  // Haltestellen auf die Straße setzen (nur kleine Korrekturen, sonst Original behalten)
  stops.forEach((st, i) => {
    const w = data.wps[i];
    if (w && !st.fixed && hav({ lat: st.oLat, lng: st.oLng }, { lat: w[0], lng: w[1] }) < 50) { st.lat = w[0]; st.lng = w[1]; }
  });
  // Auffällige Abschnitte (Umweg/Schleife/Doppelweg) melden
  const odd = [];
  (data.legs || []).forEach((d, i) => {
    const air = hav({ lat: stops[i].oLat, lng: stops[i].oLng }, { lat: stops[i + 1].oLat, lng: stops[i + 1].oLng });
    if (d > Math.max(2.5 * air, air + 300)) odd.push(`${i + 1}→${i + 2}`);
  });
  setRouteStatus(odd.length ? `Straßenverlauf geladen – ⚠ auffällig: ${odd.join(", ")} (Marker prüfen/verschieben)` : "Straßenverlauf: OpenStreetMap-Routing");
  refresh(false);
}

/* =====================================================================
   Live-Verfolgung (GPS)
   ===================================================================== */
const live = { on: false, watchId: null, pos: null, follow: true, lastSeg: 0, nextId: null, wake: null };
const $ = id => document.getElementById(id);
const hav = (a, b) => {   // Meter
  const R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
// Lage des Punktes zum Streckenabschnitt a->b: Abstand (m) und Position t (0..1)
function segInfo(pt, a, b) {
  const k = Math.cos(pt.lat * Math.PI / 180), m = 111320;
  const px = (pt.lng - a.lng) * k * m, py = (pt.lat - a.lat) * m;
  const bx = (b.lng - a.lng) * k * m, by = (b.lat - a.lat) * m;
  const len2 = bx * bx + by * by;
  const t = len2 ? Math.max(0, Math.min(1, (px * bx + py * by) / len2)) : 0;
  return { t, d: Math.hypot(px - t * bx, py - t * by) };
}
const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(m / 10) * 10 + " m";

function updateLive() {
  const stops = visibleStops(), pos = live.pos;
  if (!pos || stops.length < 2) return;
  // nächstgelegener Streckenabschnitt (Rückwärtssprünge leicht bestraft)
  let best = null;
  for (let k = 0; k < stops.length - 1; k++) {
    const si = segInfo(pos, stops[k], stops[k + 1]);
    const cost = si.d + (k < live.lastSeg ? 60 : 0);
    if (!best || cost < best.cost) best = { k, ...si, cost };
  }
  live.lastSeg = best.k;
  const atStart = best.k === 0 && best.t === 0;
  let nextIdx = atStart ? 0 : best.k + 1, prevIdx = atStart ? -1 : best.k;
  const next = stops[nextIdx], dNext = hav(pos, next);
  let state = "Nächste Haltestelle";
  if (dNext < 40) {                                   // an der Haltestelle
    state = nextIdx === stops.length - 1 ? "Endhaltestelle erreicht" : "Du bist an der Haltestelle";
  }
  live.nextId = next.id;
  $("liveState").textContent = state;
  $("liveDist").textContent = fmtDist(dNext);
  $("liveName").textContent = `${nextIdx + 1}. ${next.name}`;
  $("liveStand").textContent = hasStand(next) ? "⏱ " + dwellText(next) : "";
  $("liveNote").textContent = getStopNote(next) ? "📝 " + getStopNote(next) : "";
  const prev = prevIdx >= 0 ? stops[prevIdx] : null, pbox = $("livePrev");
  pbox.classList.toggle("hidden", !(prev && getStopNote(prev)));
  if (prev && getStopNote(prev)) pbox.textContent = `Nach „${prev.name}“: ${getStopNote(prev)}`;
  $("liveWarn").textContent = best.d > 150 ? `⚠ Abseits der Route (${fmtDist(best.d)})` : (pos.acc > 80 ? "GPS ungenau (" + Math.round(pos.acc) + " m)" : "");
  applyNext(true);
}
function applyNext(scroll) {
  document.querySelectorAll("#stops .stop").forEach(li => li.classList.toggle("next", live.on && li.dataset.id === live.nextId));
  if (scroll && live.on) {
    const li = document.querySelector(`#stops .stop[data-id="${live.nextId}"]`);
    if (li) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}
async function keepAwake() {
  try { if ("wakeLock" in navigator && live.on) live.wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

function startLive() {
  if (!("geolocation" in navigator)) { alert("Dieses Gerät/dieser Browser unterstützt keine Standortabfrage."); return; }
  live.on = true; live.follow = true; live.lastSeg = 0;
  $("liveBtn").classList.add("on"); $("liveBtn").textContent = "📍 Live-Verfolgung läuft …";
  $("live").classList.remove("hidden");
  $("liveState").textContent = "Suche GPS-Signal …"; $("liveName").textContent = "";
  $("liveDist").textContent = ""; $("liveStand").textContent = ""; $("liveNote").textContent = ""; $("liveWarn").textContent = "";
  $("livePrev").classList.add("hidden"); $("followBtn").textContent = "Karte folgt: an";
  keepAwake();
  live.watchId = navigator.geolocation.watchPosition(p => {
    live.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy || 0 };
    if (mapView) mapView.setPosition(live.pos.lat, live.pos.lng, live.pos.acc, live.follow);
    updateLive();
  }, err => {
    $("liveState").textContent = "Kein Standort";
    $("liveWarn").textContent = err.code === 1 ? "Standortzugriff verweigert – im Browser erlauben (Schloss-Symbol in der Adressleiste)." : "GPS-Signal nicht verfügbar.";
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
function stopLive() {
  if (live.watchId != null) navigator.geolocation.clearWatch(live.watchId);
  try { if (live.wake) live.wake.release(); } catch (e) {}
  live.on = false; live.watchId = null; live.pos = null; live.wake = null; live.nextId = null;
  $("liveBtn").classList.remove("on"); $("liveBtn").textContent = "📍 Live-Verfolgung starten";
  $("live").classList.add("hidden");
  if (mapView) mapView.clearPosition();
  applyNext();
}
$("liveBtn").addEventListener("click", () => live.on ? stopLive() : startLive());
$("liveStop").addEventListener("click", stopLive);
$("followBtn").addEventListener("click", () => {
  live.follow = !live.follow;
  $("followBtn").textContent = "Karte folgt: " + (live.follow ? "an" : "aus");
  if (live.follow && live.pos && mapView) mapView.setPosition(live.pos.lat, live.pos.lng, live.pos.acc, true);
});

/* =====================================================================
   Karten-Start / Fallback
   ===================================================================== */
function useSvg() {
  document.getElementById("map").classList.add("hidden");
  document.getElementById("svgmap").classList.remove("hidden");
  document.getElementById("svgNote").classList.remove("hidden");
  mapView = SvgMapView();
  refresh(true);
}
function useLeaflet() {
  document.getElementById("map").classList.remove("hidden");
  mapView = LeafletView();
  mapView.onUserDrag(() => { live.follow = false; $("followBtn").textContent = "Karte folgt: aus"; });
  refresh(true);
}

/* Start */
if (dir === "rueck") { document.getElementById("dirToggle").dataset.dir = "rueck"; document.querySelectorAll("#dirToggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.dir === "rueck"))); }
updateTitle();
if (window.L) useLeaflet(); else useSvg();   // Leaflet nicht ladbar (offline) -> SVG-Ersatzkarte
</script>
